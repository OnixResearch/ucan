# Keep Cargo configuration toolchain-neutral so builds work outside the Nix dev
# shell without requiring `clang` or `mold`. Duplicate-symbol linker suppression
# (`--allow-multiple-definition` / `-multiply_defined,suppress`) is intentionally
# omitted so linker conflicts fail closed instead of picking a symbol silently.
#
# Fast linker selection for local development is configured by `flake.nix`'s
# `devShells.default` (or caller-provided `CARGO_TARGET_*` environment vars).
